<section id="contact" style="background: #161412; color: #F5F2EC">
<div style="max-width: 1280px; margin: 0 auto; padding: 112px 32px; display: flex; flex-wrap: wrap; gap: 64px">
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #D9C9B4">Contact</p>
<h2 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 52px; line-height: 1.05">Visite privée, catalogue ou renseignement</h2>
<p style="margin: 0; color: #CFC6B8; font-size: 17px">Laissez-nous vos coordonnées : la galerie revient vers vous pour organiser votre visite ou vous adresser le catalogue de la rétrospective.</p>
</div>
<form style="flex: 1 1 520px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #D9C9B4">Prénom<input type="text" style="min-height: 48px; padding: 0 14px; background: transparent; border: 1px solid #6B645B; color: #F5F2EC"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #D9C9B4">Nom<input type="text" style="min-height: 48px; padding: 0 14px; background: transparent; border: 1px solid #6B645B; color: #F5F2EC"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #D9C9B4">E-mail<input type="email" style="min-height: 48px; padding: 0 14px; background: transparent; border: 1px solid #6B645B; color: #F5F2EC"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #D9C9B4">Téléphone<input type="tel" style="min-height: 48px; padding: 0 14px; background: transparent; border: 1px solid #6B645B; color: #F5F2EC"></label>
<label style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #D9C9B4">Votre demande
<select style="min-height: 48px; padding: 0 14px; background: #161412; border: 1px solid #6B645B; color: #F5F2EC">
<option>Organiser une visite privée</option>
<option>Recevoir le catalogue de l'exposition</option>
<option>Information sur une œuvre</option>
<option>Autre demande</option>
</select></label>
<label style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #D9C9B4">Message (facultatif)<textarea rows="4" style="padding: 12px 14px; background: transparent; border: 1px solid #6B645B; color: #F5F2EC; resize: vertical"></textarea></label>
<p style="grid-column: 1 / -1; margin: 0; font-size: 13px; color: #A79E91">Vos données sont utilisées uniquement pour répondre à votre demande. <a href="#" style="color: #E8DFD2">Mentions légales</a></p>
<div style="grid-column: 1 / -1"><button type="button" style="min-height: 52px; padding: 0 32px; background: #F5F2EC; color: #161412; border: 0; font: inherit; font-weight: 600; cursor: pointer">Envoyer ma demande</button></div>
</form>
</div>
</section>
