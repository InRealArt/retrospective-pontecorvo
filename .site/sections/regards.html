<section style="max-width: 1280px; margin: 0 auto; padding: 112px 32px">
<p style="margin: 0 0 16px; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #9E3B1F">Regards sur l'œuvre</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 48px">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 24px; padding-top: 32px; border-top: 1px solid #161412">
<blockquote style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 30px; line-height: 1.25">« [Citation de Jacques Séguéla sur l'œuvre de Pontecorvo] »</blockquote>
<figcaption style="display: flex; align-items: center; gap: 16px">
<div role="img" aria-label="Emplacement portrait : Jacques Séguéla" style="width: 56px; height: 56px; border-radius: 50%; background: #E6E0D6; flex: none"></div>
<div><div style="font-weight: 600">Jacques Séguéla</div><div style="font-size: 14px; color: #5E5A54">Publicitaire, a travaillé plus de quatorze ans avec l'artiste</div></div>
</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 24px; padding-top: 32px; border-top: 1px solid #161412">
<blockquote style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 30px; line-height: 1.25">« [Mot d'Alexandre Leadouze sur la rétrospective] »</blockquote>
<figcaption style="display: flex; align-items: center; gap: 16px">
<div role="img" aria-label="Emplacement portrait : Alexandre Leadouze" style="width: 56px; height: 56px; border-radius: 50%; background: #E6E0D6; flex: none"></div>
<div><div style="font-weight: 600">Alexandre Leadouze</div><div style="font-size: 14px; color: #5E5A54">Fondateur de la galerie, aux côtés des collectionneurs depuis quarante ans</div></div>
</figcaption>
</figure>
</div>
</section>
